name: Bug report
description: Report a problem with metronome
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal config or commands that reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "metronome version"
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system and toolchain version.
      placeholder: |
        OS: Ubuntu 24.04
        Toolchain: go1.26.4
    validations:
      required: true
