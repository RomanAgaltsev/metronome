# Desired state for this repository's settings on the remote host.
#
# Apply it with:   keel settings apply
# Check for drift: keel settings apply --check
#
# Only the keys named here are converged; anything omitted is left alone, so this
# file is safe to run against a repo you have also tuned by hand.
#
# The required_status_checks list below matches the workflows this recipe's
# modules emit. If you remove a discipline module, remove its check here too — a
# required check that never reports blocks every pull request.
version: 1

repository:
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  delete_branch_on_merge: true
  has_wiki: false
  has_projects: false

security:
  dependency_graph: true
  dependabot_alerts: true
  dependabot_security_updates: true
  # Secret scanning is unavailable on private repos without GitHub Advanced
  # Security, so it is declared only when this repo is public.
  secret_scanning: true
  secret_scanning_push_protection: true
  private_vulnerability_reporting: true

actions:
  # `local_and_verified` blocks the third-party actions this repo's own workflows
  # use — arduino/setup-task (lint), crate-ci/typos (typos),
  # amannn/action-semantic-pull-request (pr-title), docker://rhysd/actionlint
  # (security) and googleapis/release-please-action (release). Applying it gave
  # every one of those a `startup_failure`, which — since the ruleset below
  # requires their checks — made the repo unmergeable.
  #
  # keel's schema has no `patterns_allowed`, so an allow-list of just those five
  # cannot be expressed; `all` is the only working value today.
  allowed: all
  default_workflow_permissions: read
  # release-please opens its release PR with the default GITHUB_TOKEN, so it needs
  # this on: with `false` it dies on "GitHub Actions is not permitted to create or
  # approve pull requests". GitHub bundles create and approve under one flag, so
  # allowing the release PR also allows Actions to approve PRs — harmless while
  # required_approving_reviews is 0. If that is ever raised, switch
  # release-please to a PAT/App token and set this back to false.
  # See RomanAgaltsev/keel#54.
  can_approve_pull_request_reviews: true

rulesets:
  - name: "keel: main"
    target: branch
    ref: main
    required_status_checks:
      - lint
      # test.yml runs a three-OS matrix, so GitHub reports `test (<os>)` and never
      # a bare `test`. keel's template requires `test`, which nothing produces —
      # the check stayed pending forever and blocked this PR with all 11 runs
      # green. See RomanAgaltsev/keel#53.
      - test (ubuntu-latest)
      - test (macos-latest)
      - test (windows-latest)
      - typos
      - pr-title
      - dependency-review
      - actionlint
      - codeql
      - govulncheck
    required_approving_reviews: 0
    required_linear_history: true
    block_force_push: true
    block_deletion: true
    bypass:
      - repo_admin
